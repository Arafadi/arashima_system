<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Edit Car Details - {{ comp.name }}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container mt-5 mb-5">
        <div class="row justify-content-center">
            <div class="col-md-7 bg-white p-4 shadow rounded">
                <div class="d-flex justify-content-between align-items-center mb-3">
                    <h4>✏️ Edit Car & Project Details</h4>
                    <a href="{{ url_for('view_customers') }}" class="btn btn-outline-secondary btn-sm">Back</a>
                </div>
                <form method="POST">
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Car Name / Model</label>
                            <input type="text" name="car_name" class="form-control" value="{{ car.car_name }}" required>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Chassis Number</label>
                            <input type="text" name="chassis" class="form-control" value="{{ car.chassis }}" required>
                        </div>
                    </div>
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Color Name</label>
                            <input type="text" name="color_name" class="form-control" value="{{ car.color_name }}">
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Color Code</label>
                            <input type="text" name="color_code" class="form-control" value="{{ car.color_code }}">
                        </div>
                    </div>
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Client Company</label>
                            <select name="client_company" class="form-select" required>
                                {% for cust in customers %}
                                <option value="{{ cust.company_name }}" {% if car.client_company == cust.company_name %}selected{% endif %}>{{ cust.company_name }}</option>
                                {% endfor %}
                            </select>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Assigned Staff</label>
                            <select name="assigned_staff" class="form-select" required>
                                {% for st in staff_list %}
                                <option value="{{ st.name }}" {% if car.assigned_staff == st.name %}selected{% endif %}>{{ st.name }}</option>
                                {% endfor %}
                            </select>
                        </div>
                    </div>
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Contract Amount (¥)</label>
                            <input type="number" name="contract" class="form-control" value="{{ car.contract }}" required>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Received Amount (¥)</label>
                            <input type="number" name="received" class="form-control" value="{{ car.received }}" required>
                        </div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Status</label>
                        <select name="status" class="form-select" required>
                            <option value="In Progress" {% if car.status == 'In Progress' %}selected{% endif %}>In Progress</option>
                            <option value="Waiting" {% if car.status == 'Waiting' %}selected{% endif %}>Waiting</option>
                            <option value="Completed" {% if car.status == 'Completed' %}selected{% endif %}>Completed</option>
                            <option value="Delivered" {% if car.status == 'Delivered' %}selected{% endif %}>Delivered</option>
                        </select>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Work Details / Instructions</label>
                        <textarea name="details" class="form-control" rows="3" required>{{ car.details }}</textarea>
                    </div>
                    <button type="submit" class="btn btn-primary w-100">Save Changes</button>
                </form>
            </div>
        </div>
    </div>
</body>
</html>
