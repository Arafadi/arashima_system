<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Arashima System</title>
    <!-- Bootstrap 5.3 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .login-card {
            border: none;
            border-radius: 16px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
            background: #ffffff;
            overflow: hidden;
        }
        .login-header {
            background: #0f172a;
            color: white;
            padding: 35px 20px;
            text-align: center;
        }
        .form-control {
            border-radius: 8px;
            padding: 12px 15px;
            border: 1px solid #cbd5e1;
        }
        .form-control:focus {
            box-shadow: 0 0 0 3px rgba(30, 41, 59, 0.15);
            border-color: #1e293b;
        }
        .btn-login {
            border-radius: 8px;
            padding: 12px;
            font-weight: 600;
            background: #0f172a;
            border: none;
            color: white;
            transition: background 0.2s;
        }
        .btn-login:hover {
            background: #1e293b;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-5 col-lg-4">
                <div class="card login-card">
                    <div class="login-header">
                        <div class="fs-1 text-warning mb-2"><i class="fa-solid fa-car-tunnel"></i></div>
                        <h4 class="fw-bold mb-1">{{ comp.name }}</h4>
                        <p class="text-muted small mb-0">{{ comp.address }}</p>
                    </div>
                    <div class="card-body p-4 p-md-5">
                        
                        {% if error %}
                        <div class="alert alert-danger alert-dismissible fade show py-2 small mb-4" role="alert">
                            <i class="fa-solid fa-triangle-exclamation me-1"></i> {{ error }}
                            <button type="button" class="btn-close py-2" data-bs-dismiss="alert" aria-label="Close"></button>
                        </div>
                        {% endif %}

                        <form action="{{ url_for('login') }}" method="POST">
                            <div class="mb-3">
                                <label class="form-label small fw-semibold text-muted">Username</label>
                                <div class="input-group">
                                    <span class="input-group-text bg-light border-end-0"><i class="fa-solid fa-user text-muted"></i></span>
                                    <input type="text" name="username" class="form-control border-start-0 ps-0" placeholder="Enter username" required autofocus>
                                </div>
                            </div>

                            <div class="mb-4">
                                <label class="form-label small fw-semibold text-muted">Password</label>
                                <div class="input-group">
                                    <span class="input-group-text bg-light border-end-0"><i class="fa-solid fa-lock text-muted"></i></span>
                                    <input type="password" name="password" class="form-control border-start-0 ps-0" placeholder="Enter password" required>
                                </div>
                            </div>

                            <button type="submit" class="btn btn-login w-100 shadow-sm">
                                <i class="fa-solid fa-right-to-bracket me-2"></i> Secure Login
                            </button>
                        </form>
                    </div>
                    <div class="card-footer bg-light text-center py-3 border-0">
                        <small class="text-muted">Authorized Personnel & Clients Only</small>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
