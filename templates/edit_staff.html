<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Edit Staff - {{ comp.name }}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container mt-5 mb-5">
        <div class="row justify-content-center">
            <div class="col-md-6 bg-white p-4 shadow rounded">
                <div class="d-flex justify-content-between align-items-center mb-3">
                    <h4>✏️ Edit Staff Profile</h4>
                    <a href="{{ url_for('view_staff') }}" class="btn btn-outline-secondary btn-sm">Back</a>
                </div>
                <form method="POST">
                    <div class="mb-3"><label class="form-label">Staff Name</label><input type="text" name="name" class="form-control" value="{{ st.name }}" required></div>
                    <div class="mb-3"><label class="form-label">Mobile Number</label><input type="text" name="mobile" class="form-control" value="{{ st.mobile }}" required></div>
                    <div class="mb-3"><label class="form-label">Base Salary (¥)</label><input type="number" name="base_salary" class="form-control" value="{{ st.base_salary }}" required></div>
		        <!-- Base Salary Field এর নিচে এই কোডটুকু বসিয়ে দিন -->
<div class="mb-3">
    <label for="advance_balance" class="form-label fw-bold">Advance Due / Balance (¥)</label>
    <input type="number" step="any" class="form-control" id="advance_balance" name="advance_balance" value="{{ st.get('advance_balance', 0) }}">
</div>
                    <div class="mb-3"><label class="form-label">Login Username</label><input type="text" name="username" class="form-control" value="{{ st.username }}" required></div>
                    <div class="mb-3"><label class="form-label">New Password (leave blank to keep current)</label><input type="password" name="password" class="form-control" placeholder="Enter new password if needed"></div>
                    <button type="submit" class="btn btn-primary w-100">Update Staff Profile</button>
                </form>
            </div>
        </div>
    </div>
</body>
</html>
